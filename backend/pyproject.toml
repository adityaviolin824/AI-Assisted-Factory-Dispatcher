[project]
name = "sweaterco-project-env"
version = "0.1.0"
description = "Env for testing our subcontractor"
requires-python = "==3.13.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.147.0",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith",
    "openai>=3.16.2",
    "pydantic",
    "python-dotenv",
    "tzdata>=2026.4",
]

[project.optional-dependencies]
translation = [
    "mlx-lm>=0.32.2",
]

[dependency-groups]
dev = [
    "gradio>=6.30.0",
    "ipykernel",
    "jupyterlab",
    "langchain>=1.4.2",
    "pandas>=3.0.6",
    "streamlit>=1.65.0",
]

[tool.uv]
package = false
python-downloads = "never"
