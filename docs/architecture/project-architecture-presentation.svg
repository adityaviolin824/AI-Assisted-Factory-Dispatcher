<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Track 2 end-to-end project architecture</title>
  <desc id="desc">Operations channels feed persistent message capture, LangGraph intake and validation, deterministic allocation, dispatcher feedback and planned transactional assignment. Clarification returns to the source channel; changed constraints invalidate checks and trigger a new preview. Current and planned capabilities are labelled.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #243247; }
    .body { font-size: 20px; }
    .stage-title { font-size: 25px; font-weight: 600; }
    .card-title { font-size: 21px; font-weight: 600; }
    .small { font-size: 18px; }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#65758a"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="60" y="64" font-size="36" font-weight="600">Track 2: end-to-end dispatch architecture</text>
  <text x="60" y="103" font-size="22">LLMs interpret and explain. Python validates, calculates and selects. One dispatcher controls live assignments.</text>

  <g font-size="18">
    <rect x="60" y="127" width="17" height="17" rx="3" fill="#3773b9"/><text x="86" y="142">Frontend / chat</text>
    <rect x="267" y="127" width="17" height="17" rx="3" fill="#7750ad"/><text x="293" y="142">LangGraph</text>
    <rect x="434" y="127" width="17" height="17" rx="3" fill="#27806a"/><text x="460" y="142">Deterministic processing</text>
    <rect x="712" y="127" width="17" height="17" rx="3" fill="#b27a22"/><text x="738" y="142">Dispatcher / review</text>
    <rect x="954" y="127" width="17" height="17" rx="3" fill="#718096"/><text x="980" y="142">Storage / evidence</text>
    <rect x="1200" y="126" width="25" height="19" fill="#fff" stroke="#718096" stroke-dasharray="5 3"/><text x="1234" y="142">Planned live capability</text>
  </g>

  <rect x="638" y="176" width="1202" height="631" rx="15" fill="#f8f4ff" stroke="#7750ad" stroke-width="2"/>
  <text x="662" y="207" font-size="22" fill="#382454" font-weight="600">LANGGRAPH: shared state, named nodes, conditional routes and planned human pause / resume</text>
  <g data-stage="1. Frontend" data-left="60" data-right="320">
    <text class="stage-title" x="190" y="250" text-anchor="middle">1. Frontend</text>
    <rect x="60" y="272" width="260" height="370" rx="10" fill="#e6f0ff" stroke="#3773b9" stroke-width="2" />
    <text class="card-title" x="78" y="306">Operations channels</text>
    <text class="body" x="78" y="339">People submit requests,</text>
<text class="body" x="78" y="368">questions and corrections.</text>
<text class="body" x="78" y="397"></text>
<text class="body" x="78" y="426">Current: one shared room.</text>
<text class="body" x="78" y="455">Planned: multiple</text>
<text class="body" x="78" y="484">live channels.</text>
<text class="body" x="78" y="513">Keep source ownership.</text>
<text class="body" x="78" y="542">Clarifications return here.</text>
<text class="body" x="78" y="571"></text>
<text class="body" x="78" y="600">Landing / demo: planned.</text>
  </g>
<g data-stage="2. Capture" data-left="360" data-right="620">
    <text class="stage-title" x="490" y="250" text-anchor="middle">2. Capture</text>
    <rect x="360" y="272" width="260" height="370" rx="10" fill="#edf0f4" stroke="#718096" stroke-width="2" />
    <text class="card-title" x="378" y="306">Messages and intake</text>
    <text class="body" x="378" y="339">Save original message,</text>
<text class="body" x="378" y="368">sender, time and identity.</text>
<text class="body" x="378" y="397"></text>
<text class="body" x="378" y="426">Current: SQLite messages.</text>
<text class="body" x="378" y="455">Export TXT + manifest.</text>
<text class="body" x="378" y="484">Manually start batch run.</text>
<text class="body" x="378" y="513"></text>
<text class="body" x="378" y="542">Planned: live API + queue,</text>
<text class="body" x="378" y="571">burst control and dedup.</text>
  </g>
<g data-stage="3. Intake" data-left="660" data-right="920">
    <text class="stage-title" x="790" y="250" text-anchor="middle">3. Intake</text>
    <rect x="660" y="272" width="260" height="370" rx="10" fill="#eee7fb" stroke="#7750ad" stroke-width="2" />
    <text class="card-title" x="678" y="306">Interpret and verify</text>
    <text class="body" x="678" y="339">LLM extracts jobs and</text>
<text class="body" x="678" y="368">proposes task links.</text>
<text class="body" x="678" y="397">Python checks evidence.</text>
<text class="body" x="678" y="426">Link corrections to tasks.</text>
<text class="body" x="678" y="455">Version tasks; verify facts.</text>
<text class="body" x="678" y="484">Uncertainty goes to review.</text>
<text class="body" x="678" y="513"></text>
<text class="body" x="678" y="542">Current: batch graph.</text>
<text class="body" x="678" y="571">Planned: human waits.</text>
  </g>
<g data-stage="4. Allocation" data-left="960" data-right="1220">
    <text class="stage-title" x="1090" y="250" text-anchor="middle">4. Allocation</text>
    <rect x="960" y="272" width="260" height="370" rx="10" fill="#e1f3ed" stroke="#27806a" stroke-width="2" />
    <text class="card-title" x="978" y="306">Calculate and rank</text>
    <text class="body" x="978" y="339">Python filters hard rules:</text>
<text class="body" x="978" y="368">status, capability, caps,</text>
<text class="body" x="978" y="397">requested and excluded.</text>
<text class="body" x="978" y="426">Calculate queue + ETA,</text>
<text class="body" x="978" y="455">rework, cost and quality.</text>
<text class="body" x="978" y="484">Require on-time options.</text>
<text class="body" x="978" y="513">Rank by stated preference.</text>
<text class="body" x="978" y="542">EDD: earliest due first.</text>
<text class="body" x="978" y="571">Reserve tentative queues.</text>
  </g>
<g data-stage="5. Dispatcher" data-left="1260" data-right="1520">
    <text class="stage-title" x="1390" y="250" text-anchor="middle">5. Dispatcher</text>
    <rect x="1260" y="272" width="260" height="370" rx="10" fill="#fff0d5" stroke="#b27a22" stroke-width="2" stroke-dasharray="7 5"/>
    <text class="card-title" x="1278" y="306">Review and feedback</text>
    <text class="body" x="1278" y="339">Show preview + evidence,</text>
<text class="body" x="1278" y="368">alternatives and warnings.</text>
<text class="body" x="1278" y="397">One dispatcher decides.</text>
<text class="body" x="1278" y="426">Why? Use stored metrics.</text>
<text class="body" x="1278" y="455">New constraint? Replan.</text>
<text class="body" x="1278" y="484">Confirm / reject / cancel.</text>
<text class="body" x="1278" y="513"></text>
<text class="body" x="1278" y="542">Current: stored plan only.</text>
<text class="body" x="1278" y="571">Planned: console + Q&amp;A.</text>
  </g>
<g data-stage="6. Assignment" data-left="1560" data-right="1820">
    <text class="stage-title" x="1690" y="250" text-anchor="middle">6. Assignment</text>
    <rect x="1560" y="272" width="260" height="370" rx="10" fill="#e1f3ed" stroke="#27806a" stroke-width="2" stroke-dasharray="7 5"/>
    <text class="card-title" x="1578" y="306">Recheck and commit</text>
    <text class="body" x="1578" y="339">Planned: recheck current</text>
<text class="body" x="1578" y="368">facts, rules and versions.</text>
<text class="body" x="1578" y="397"></text>
<text class="body" x="1578" y="426">Commit assignment and</text>
<text class="body" x="1578" y="455">reserve queue atomically.</text>
<text class="body" x="1578" y="484">Record outcome + history.</text>
<text class="body" x="1578" y="513">Moves preserve prior work</text>
<text class="body" x="1578" y="542">until replacement commits.</text>
<text class="body" x="1578" y="571">Publish to chat + console.</text>
  </g>
  <path d="M 320 449 H 349" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 620 449 H 649" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 920 449 H 949" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1220 449 H 1249" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1520 449 H 1549" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M 1390 642 V 696 H 790 V 657" fill="none" stroke="#65758a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="834" y="666" width="525" height="27" fill="#f8f4ff"/>
  <text class="small" x="1097" y="686" text-anchor="middle">Correction / what-if: invalidate, verify and replan</text>
  <path d="M 770 642 V 756 H 190 V 657" fill="none" stroke="#65758a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="233" y="727" width="494" height="27" fill="#ffffff"/>
  <text class="small" x="480" y="747" text-anchor="middle">Clarify in the source channel; resume the same task</text>
  <text class="small" x="960" y="843" text-anchor="middle">Commit only after confirmation under the agreed policy; publish the recorded outcome back to the dispatcher and originating channel.</text>

  <g>
    <rect x="60" y="875" width="560" height="117" rx="10" fill="#edf0f4" stroke="#718096" stroke-width="1.5"/>
    <text class="card-title" x="84" y="910">Trusted source facts</text>
    <text class="body" x="84" y="945">orders.csv and workshops.csv</text>
    <text class="body" x="84" y="974">Exact lookup for identity, capability and workshop rules.</text>

    <rect x="660" y="875" width="560" height="117" rx="10" fill="#edf0f4" stroke="#718096" stroke-width="1.5"/>
    <text class="card-title" x="684" y="910">Workflow and decision evidence</text>
    <text class="body" x="684" y="945">Current: run state, reviews and allocation-plan JSON.</text>
    <text class="body" x="684" y="974">Planned: durable checkpoints and stored decisions.</text>

    <rect x="1260" y="875" width="560" height="117" rx="10" fill="#edf0f4" stroke="#718096" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text class="card-title" x="1284" y="910">Operational assignments and queues</text>
    <text class="body" x="1284" y="945">Planned: committed reservations and outcome history.</text>
    <text class="body" x="1284" y="974">Recheck fresh state; protect changes in a transaction.</text>
  </g>
  <text class="small" x="60" y="1041">A recommendation is a preview. Initial approval policy remains open. Separate evaluation: 120-order historical replay and 30-request checks.</text>
</svg>